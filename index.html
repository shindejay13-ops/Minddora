<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Minddora — a student psycho-emotional wellness space with mood check-ins, calm tools, private journaling and progress tracking." />
  <title>Minddora — Student Psycho-Emotional Wellness App</title>
  <style>
    :root {
      --bg-cream: #F9F7F2;
      --surface: #FFFFFF;
      --sage: #52796F;
      --sage-dark: #354F52;
      --sage-light: #E8F0EC;
      --coffee: #D4A373;
      --coffee-light: #FAEDCD;
      --sos-red: #D9534F;
      --sos-bg: #FDF2F2;
      --text-main: #2B2D2F;
      --text-muted: #6C757D;
      --border: #EAE6DF;
      --radius: 20px;
      --shadow: 0 6px 20px rgba(53, 79, 82, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-main);
      padding-bottom: 88px; /* Space for bottom nav */
      overflow-x: hidden;
    }

    /* Top App Bar (Flo Style) */
    .top-bar {
      background: var(--surface);
      padding: 16px 20px 14px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--sage-dark);
    }
    .sos-pill {
      background: var(--sos-red);
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(217, 83, 79, 0.3);
    }

    /* Flo-style 7-Day Strip */
    .day-strip {
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }
    .day-pill {
      flex: 1;
      text-align: center;
      padding: 8px 4px;
      border-radius: 14px;
      background: var(--bg-cream);
      cursor: pointer;
      transition: all 0.2s;
    }
    .day-pill.today {
      background: var(--sage);
      color: #fff;
      font-weight: 700;
    }
    .day-pill span { display: block; font-size: 0.7rem; opacity: 0.8; }
    .day-pill strong { font-size: 0.9rem; }
    .day-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--coffee); margin: 3px auto 0;
    }
    .day-pill.today .day-dot { background: #fff; }

    /* Screen Container */
    .screen {
      display: none;
      max-width: 720px;
      margin: 0 auto;
      padding: 18px 16px;
      animation: fadeIn 0.25s ease;
    }
    .screen.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards & Typography */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    h2 { font-size: 1.15rem; color: var(--sage-dark); }
    h3 { font-size: 1rem; color: var(--sage-dark); margin-bottom: 6px; }
    .sub { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 14px; line-height: 1.4; }
    .tag {
      font-size: 0.72rem; font-weight: 700; padding: 4px 10px;
      border-radius: 999px; background: var(--sage-light); color: var(--sage-dark);
    }

    /* Buttons & Inputs */
    .btn {
      background: var(--sage);
      color: #fff;
      border: none;
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.9rem;
      width: 100%;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.85; }
    .btn-coffee { background: var(--coffee); color: #2B2D2F; }
    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--sage);
      color: var(--sage-dark);
    }

    input[type="text"], textarea, select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      font-family: inherit;
      font-size: 0.9rem;
      margin-bottom: 12px;
      background: var(--bg-cream);
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--sage); }

    /* Mood Grid */
    .mood-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }
    .mood-btn {
      background: var(--bg-cream);
      border: 2px solid transparent;
      border-radius: 14px;
      padding: 8px 2px;
      text-align: center;
      cursor: pointer;
    }
    .mood-btn.selected { border-color: var(--sage); background: var(--sage-light); }
    .mood-btn span { font-size: 1.4rem; display: block; }
    .mood-btn small { font-size: 0.68rem; font-weight: 600; color: var(--text-muted); }

    /* Weekly Bar Chart */
    .chart-wrap {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 110px;
      background: var(--bg-cream);
      border-radius: 16px;
      padding: 14px 12px 8px;
      margin-top: 14px;
    }
    .bar-col { width: 11%; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
    .bar-fill { width: 100%; max-width: 22px; background: var(--sage); border-radius: 6px 6px 0 0; transition: height 0.4s; }
    .bar-col span { font-size: 0.7rem; color: var(--text-muted); margin-top: 5px; font-weight: 600; }

    /* 5-Day Challenge Pills */
    .challenge-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--bg-cream);
      border-radius: 12px;
      margin-bottom: 8px;
      font-size: 0.86rem;
    }

    /* Tools Sub-Tabs */
    .sub-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .sub-tabs::-webkit-scrollbar { display: none; }
    .sub-tab {
      white-space: nowrap;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }
    .sub-tab.active { background: var(--sage-dark); color: #fff; border-color: var(--sage-dark); }
    .tool-panel { display: none; }
    .tool-panel.active { display: block; }

    /* Breathing Circle */
    .breath-circle {
      width: 130px; height: 130px;
      border-radius: 50%;
      background: var(--sage-light);
      border: 3px solid var(--sage);
      display: flex; align-items: center; justify-content: center;
      margin: 16px auto;
      font-weight: 700; color: var(--sage-dark);
      transition: transform 4s ease-in-out, background 0.5s;
    }
    .breath-circle.expand { transform: scale(1.22); background: #d4e4dc; }

    /* Emotion Wheel Chips */
    .chip-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip {
      padding: 7px 13px; border-radius: 999px; font-size: 0.82rem; font-weight: 600;
      background: var(--bg-cream); border: 1.5px solid var(--border); cursor: pointer;
    }
    .chip.active { background: var(--sage); color: #fff; border-color: var(--sage); }

    /* AI Companion Chat */
    .chat-box {
      height: 230px;
      overflow-y: auto;
      background: var(--bg-cream);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.86rem;
      line-height: 1.4;
    }
    .msg.bot { background: var(--surface); border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg.user { background: var(--sage); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .stat-box { padding: 16px; border-radius: 16px; }
    .stat-box h3 { font-size: 1.8rem; margin-bottom: 2px; }
    .stat-box p { font-size: 0.8rem; font-weight: 600; opacity: 0.85; }

    /* Settings Toggle Rows */
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .setting-row:last-child { border-bottom: none; }

    /* Feedback Banner */
    .alert-box {
      background: var(--sage-light);
      color: var(--sage-dark);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-top: 12px;
      display: none;
      font-weight: 500;
    }

    /* SOS Modal Overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(43, 45, 47, 0.6);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
      background: var(--surface);
      border-radius: 24px;
      padding: 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 14px 40px rgba(0,0,0,0.2);
    }
    .sos-option {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      margin-bottom: 8px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--bg-cream);
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .sos-option:hover { border-color: var(--sos-red); background: var(--sos-bg); }

    /* Bottom App Navigation Bar (Flo Style) */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 4px 12px;
      z-index: 100;
    }
    .nav-item {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
    }
    .nav-item.active { color: var(--sage-dark); }
    .nav-icon {
      font-size: 1.25rem;
      padding: 4px 12px;
      border-radius: 999px;
      transition: background 0.2s;
    }
    .nav-item.active .nav-icon { background: var(--sage-light); }

    #auth-screen { max-width: 460px; margin: 7vh auto 24px; padding: 22px; }
    .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 24px; box-shadow: var(--shadow); }
    .auth-card input { width:100%; padding:13px 14px; border:1.5px solid var(--border); border-radius:13px; margin:7px 0 14px; font:inherit; background:var(--bg-cream); }
    .auth-card label { display:block; font-size:.84rem; font-weight:650; color:var(--sage-dark); }
    .auth-tabs { display:flex; gap:8px; margin:16px 0; }
    .auth-tabs button { flex:1; border:1px solid var(--border); border-radius:12px; padding:10px; background:var(--bg-cream); color:var(--sage-dark); font-weight:650; }
    .auth-tabs button.active { background:var(--sage-dark); color:white; }
    #auth-message { display:none; margin-top:12px; padding:11px 13px; border-radius:12px; font-size:.84rem; background:var(--sage-light); color:var(--sage-dark); }
    #auth-message.error { display:block; background:var(--sos-bg); color:#842029; }
    .auth-muted { color:var(--text-muted); font-size:.82rem; line-height:1.45; }
    #user-chip { font-size:.75rem; color:var(--text-muted); margin-left:auto; margin-right:8px; }
    .logout-btn { border:1px solid var(--border); background:white; color:var(--sage-dark); border-radius:10px; padding:7px 10px; font-weight:650; }
    @media (max-width:480px) { #auth-screen { margin:3vh 12px 20px; padding:10px; } .auth-card { padding:20px; } }



    /* Limited-privacy administrator dashboard */
    #admin-panel{display:none;max-width:1100px;margin:22px auto;padding:0 16px 40px}
    .admin-hero{background:linear-gradient(135deg,#354F52,#52796F);color:#fff;border-radius:22px;padding:22px;margin-bottom:16px}
    .admin-hero h1{font-size:1.55rem;margin:6px 0}.admin-hero p{opacity:.9;font-size:.9rem}
    .admin-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}
    .admin-stat{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
    .admin-stat b{display:block;font-size:1.6rem;color:var(--sage-dark);margin-top:5px}
    .admin-table-wrap{overflow:auto;background:#fff;border:1px solid var(--border);border-radius:16px}
    .admin-table{width:100%;border-collapse:collapse;min-width:620px;font-size:.86rem}
    .admin-table th,.admin-table td{padding:12px;text-align:left;border-bottom:1px solid var(--border)}
    .admin-table th{background:#f4f7f4;color:var(--sage-dark)}
    .admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
    .admin-note{background:#f4f7f4;border:1px solid #dce8df;padding:12px;border-radius:12px;font-size:.82rem;color:#40554d;line-height:1.5}
    @media(max-width:600px){.admin-grid{grid-template-columns:1fr 1fr}#admin-panel{margin-top:12px}.admin-hero{padding:18px}}

    /* Structural redesign for authentication screen */
    #auth-screen.auth-layout{
      width:min(1120px,100% - 34px);max-width:1120px;min-height:calc(100vh - 35px);
      margin:18px auto 28px;padding:0;display:grid;grid-template-columns:1.02fr .98fr;
      overflow:hidden;border:1px solid #e7def5;border-radius:30px;background:#fff;
      box-shadow:0 24px 70px rgba(58,37,104,.12)
    }
    .auth-visual{position:relative;min-height:680px;padding:38px 42px;color:#fff;overflow:hidden;
      display:flex;flex-direction:column;justify-content:space-between;
      background:radial-gradient(circle at 80% 22%,#c7a9ff88 0 8%,transparent 27%),
      radial-gradient(circle at 8% 88%,#b9a0f777 0 10%,transparent 30%),
      linear-gradient(145deg,#39236f 0%,#6945b7 54%,#a17be4 100%)}
    .auth-visual:after{content:"";position:absolute;width:430px;height:430px;border:1px solid #ffffff25;border-radius:50%;right:-160px;bottom:-190px;box-shadow:0 0 0 35px #ffffff0b,0 0 0 75px #ffffff08}
    .auth-visual-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
    .auth-mark{width:45px;height:45px;border-radius:16px;background:#ffffff20;border:1px solid #ffffff45;display:grid;place-items:center;font-size:28px}
    .auth-brand{font-size:25px;font-weight:850;letter-spacing:-.7px}
    .auth-illustration{height:285px;position:relative;display:grid;place-items:center;z-index:1}
    .auth-person{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;font-size:104px;
      background:radial-gradient(circle,#fff 0%,#eee3ff 55%,#d2bafa 100%);box-shadow:0 18px 45px #21104655;position:relative;z-index:2}
    .auth-orbit{position:absolute;border:1px solid #ffffff45;border-radius:50%;width:260px;height:260px}
    .orbit-two{width:330px;height:330px;border-style:dashed;opacity:.55}
    .auth-leaf{position:absolute;font-size:48px;z-index:3;filter:drop-shadow(0 8px 10px #24134a44)}
    .leaf-one{left:12%;bottom:18%}.leaf-two{right:12%;top:17%}
    .auth-visual-copy{position:relative;z-index:1;max-width:440px}
    .auth-kicker{font-size:10px;font-weight:850;letter-spacing:1.8px;color:#9475d8}
    .auth-visual .auth-kicker{color:#e1d3ff}
    .auth-visual-copy h1{font-size:clamp(34px,4vw,49px);line-height:1.05;letter-spacing:-1.8px;margin:13px 0}
    .auth-visual-copy p{font-size:16px;color:#eee6ff;line-height:1.6;max-width:360px}
    .auth-feature-pills{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:8px}
    .auth-feature-pills span{font-size:11px;border:1px solid #ffffff45;background:#ffffff15;border-radius:999px;padding:8px 11px}
    .auth-form-side{display:flex;flex-direction:column;justify-content:center;padding:34px clamp(22px,4vw,58px);background:linear-gradient(180deg,#fff,#fcfaff)}
    .auth-card{width:100%;max-width:430px;margin:auto;background:transparent;border:0;border-radius:0;padding:0;box-shadow:none}
    .auth-heading{margin-bottom:20px}
    .auth-heading h2{font-size:30px;line-height:1.14;letter-spacing:-1px;color:#35245f;margin:9px 0}
    .auth-heading .auth-muted{margin:0}
    .auth-mobile-mark{display:none}
    .auth-tabs{padding:5px;background:#f3effa;border-radius:14px;gap:5px;margin:18px 0 21px}
    .auth-tabs button{border:0;border-radius:11px;padding:12px;background:transparent;color:#665783}
    .auth-tabs button.active{background:linear-gradient(135deg,#8c6cdb,#5f3caf);box-shadow:0 5px 13px #6947b533}
    .auth-card label{font-size:12px;letter-spacing:.2px;color:#554477;margin:12px 0 6px}
    .auth-card input{padding:14px 15px;border-radius:13px;background:#fff;margin:0 0 8px;font-size:14px}
    .auth-primary{width:100%;padding:14px 16px;border-radius:13px;margin-top:12px}
    .auth-secondary{width:100%;padding:13px 16px;border-radius:13px}
    #auth-message{margin-top:12px}
    .auth-privacy{display:flex;gap:9px;align-items:flex-start;background:#f6f2fd;border:1px solid #eee7f8;border-radius:13px;padding:11px;margin-top:20px}
    .auth-privacy p{margin:0;font-size:11px}
    .auth-bottom-note{text-align:center;color:#9189a3;font-size:11px;margin:22px 0 0}
    .auth-bottom-note span{padding:0 5px;color:#a48bd7}
    @media(max-width:760px){
      #auth-screen.auth-layout{width:calc(100% - 22px);min-height:0;margin:11px auto 20px;grid-template-columns:1fr;border-radius:24px}
      .auth-visual{min-height:0;padding:20px 21px 17px;border-radius:23px 23px 0 0;gap:9px}
      .auth-visual-top{gap:9px}.auth-mark{width:35px;height:35px;font-size:22px;border-radius:12px}.auth-brand{font-size:21px}
      .auth-illustration{height:105px;order:2}
      .auth-person{width:88px;height:88px;font-size:53px}
      .auth-orbit{width:118px;height:118px}.orbit-two{width:148px;height:148px}
      .auth-leaf{font-size:25px}.leaf-one{left:23%;bottom:7%}.leaf-two{right:22%;top:4%}
      .auth-visual-copy{order:3}.auth-visual-copy h1{font-size:27px;margin:5px 0}.auth-visual-copy p{font-size:12px;margin:4px 0 0}
      .auth-feature-pills{order:4;gap:5px}.auth-feature-pills span{font-size:9px;padding:6px 8px}
      .auth-form-side{padding:24px 21px 18px}
      .auth-heading{margin-bottom:13px}.auth-heading h2{font-size:25px}
      .auth-mobile-mark{display:none}
      .auth-tabs{margin:13px 0 16px}
      .auth-card{max-width:none}
      .auth-bottom-note{margin-top:14px}
    }

  
    /* Minddora premium lavender dashboard refresh */
    :root {
      --bg-cream:#F7F5FF; --surface:#FFFFFF; --sage:#7656D6; --sage-dark:#35205F;
      --sage-light:#EEE8FF; --coffee:#C4A8FF; --coffee-light:#F3EDFF;
      --text-main:#241B35; --text-muted:#766D86; --border:#E9E2F5;
      --shadow:0 10px 28px rgba(64,39,112,.08);
    }
    body{background:linear-gradient(180deg,#F5F0FF 0,#FBFAFF 360px);color:var(--text-main)}
    .top-bar{background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid #E9E2F5;padding:17px 18px 14px}
    .brand{color:#35205F;letter-spacing:-.3px}.brand:first-letter{color:#7656D6}
    .logout-btn{border-color:#E9E2F5;color:#5B438A;background:#F8F5FF}
    .sos-pill{background:#E64F72;box-shadow:0 5px 14px rgba(230,79,114,.22)}
    .day-pill{background:#F5F1FC;border:1px solid transparent;border-radius:15px;padding:9px 3px}
    .day-pill.today{background:#7656D6;border-color:#7656D6;box-shadow:0 5px 12px rgba(118,86,214,.2)}
    .screen{max-width:760px;padding:20px 16px 28px}
    .card{border:1px solid #EAE4F5;border-radius:22px;box-shadow:0 9px 26px rgba(64,39,112,.065);padding:21px;margin-bottom:17px}
    #screen-today>.card:first-child{background:radial-gradient(circle at 88% 10%,rgba(255,255,255,.22),transparent 32%),linear-gradient(130deg,#392064 0%,#7656D6 62%,#9A7CEB 100%)!important;border:0;min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:7px;box-shadow:0 14px 30px rgba(75,48,132,.2)}
    #screen-today>.card:first-child p:last-child{max-width:440px;line-height:1.55}
    h2,h3{color:#39245F}.sub{color:#7D748D;line-height:1.55}
    .tag{background:#F0EAFE;color:#6443B0}

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>

  // Each signed-in account has its own Firestore wellness record.
  let appData = { moods: 0, activities: 0, friScore: 70, pinLocked: false, journals: [], wellnessDays: [], wellnessActions: {}, wellnessXP: 0, dailyChallenge: {}, dailyChallengeDays: [], breathingDates: [], dailyQuizDays: [], spinRewardDays: [], spinRewards: [], quizCorrect: 0 };
  appData.dailyQuizDays = Array.isArray(appData.dailyQuizDays) ? appData.dailyQuizDays : [];
  appData.spinRewardDays = Array.isArray(appData.spinRewardDays) ? appData.spinRewardDays : [];
  appData.spinRewards = Array.isArray(appData.spinRewards) ? appData.spinRewards : [];
  function normalizeAppData(){
    appData=appData||{};
    const arrayKeys=['journals','moodEntries','wellnessDays','dailyChallengeDays','breathingDates','dailyQuizDays','spinRewardDays','spinRewards'];
    arrayKeys.forEach(key=>{if(!Array.isArray(appData[key]))appData[key]=[];});
    if(!appData.wellnessActions||typeof appData.wellnessActions!=='object')appData.wellnessActions={};
    if(!appData.dailyChallenge||typeof appData.dailyChallenge!=='object')appData.dailyChallenge={};
    appData.wellnessXP=Number(appData.wellnessXP)||0;
    appData.moods=Number(appData.moods)||appData.moodEntries.length;
    appData.activities=Number(appData.activities)||0;
    appData.friScore=Number(appData.friScore)||70;
  }
  let currentUser = null;
  let currentRole = null;
  let authMode = 'student';
  let authView = 'signup';
  let cloudSaveQueue = Promise.resolve();
  let adminStudentCache = [];
  let adminModeActive = false;

  normalizeAppData();
  let selectedMood = "";
  let selectedScore = 70;
  // Mood check-ins are stored by local calendar date (YYYY-MM-DD).
  appData.moodEntries = Array.isArray(appData.moodEntries) ? appData.moodEntries : [];
  let audioCtx = null, osc = null;

  function getWellnessStreak() {
    const days = [...new Set(appData.wellnessDays || [])].sort();
    const today = localDateKey(new Date());
    const yesterdayDate = new Date(); yesterdayDate.setDate(yesterdayDate.getDate()-1);
    const yesterday = localDateKey(yesterdayDate);
    let cursor = days.includes(today) ? today : yesterday;
    if (!days.includes(cursor)) return 0;
    let count = 0;
    while (days.includes(cursor)) { count++; const d = new Date(cursor + 'T00:00:00'); d.setDate(d.getDate()-1); cursor = localDateKey(d); }
    return count;
  }
  function recordWellnessAction(action, points) {
    const today = localDateKey(new Date());
    appData.wellnessDays = Array.isArray(appData.wellnessDays) ? appData.wellnessDays : [];
    appData.wellnessActions = appData.wellnessActions || {};
    const todays = appData.wellnessActions[today] || [];
    if (!todays.includes(action)) {
      todays.push(action);
      appData.wellnessActions[today] = todays;
      appData.wellnessXP = (Number(appData.wellnessXP) || 0) + (points || 0);
    }
    renderEngagement();
  }

  function renderEngagement() {
    const streak = getWellnessStreak();
    const xp = Number(appData.wellnessXP) || 0;
    const days = (appData.wellnessDays || []).length;
    const completed = getTodayCoreCompletion().count;
    const set = (id, value) => { const el=document.getElementById(id); if(el) el.textContent=value; };
    set('engage-streak', streak + ' 🔥'); set('engage-xp', xp); set('engage-days', days);
    set('engage-badge', xp >= 200 ? '🏆 Mind Champion' : xp >= 75 ? '⭐ Rising Star' : xp >= 25 ? '🌿 Growing' : '🌱 Starter');
    set('engage-progress-label', completed + ' / 4');
    const fill=document.getElementById('engage-progress-fill'); if(fill) fill.style.width=(completed/4*100)+'%';
  }


  const dailyMindQuiz = [
    {q:'When you feel stressed before an exam, what is a helpful first step?',a:['Take one slow breath and break work into a small step','Stay awake all night','Stop eating'],correct:0,why:'A short pause and one manageable step can make stress feel more manageable.'},
    {q:'Which habit can support better sleep?',a:['Keeping a regular sleep time','Scrolling in bed for hours','Drinking lots of caffeine late'],correct:0,why:'A regular sleep routine helps your body prepare for rest.'},
    {q:'What is a kind response when a friend shares a problem?',a:['Listen without judging','Immediately compare their problem','Make fun of their feelings'],correct:0,why:'Listening with care helps someone feel heard and supported.'},
    {q:'If a task feels too big, what can you try?',a:['Divide it into smaller steps','Give up immediately','Do everything at once'],correct:0,why:'Small steps can make a difficult task easier to begin.'},
    {q:'What does a grounding exercise help you do?',a:['Notice the present moment using your senses','Predict the future','Avoid all emotions'],correct:0,why:'Grounding brings attention back to the present moment.'},
    {q:'Is it okay to ask someone you trust for support?',a:['Yes, asking for support is a strength','No, never talk about feelings','Only when everything is perfect'],correct:0,why:'Reaching out to a trusted person is a healthy way to seek support.'},
    {q:'What is a realistic way to take a study break?',a:['Stretch and rest your eyes for a few minutes','Skip every break','Keep studying while exhausted'],correct:0,why:'Short, gentle breaks can help you reset your attention.'}
  ];
  function getTodayQuiz(){const key=localDateKey(new Date());const n=Math.floor(new Date(key+'T00:00:00').getTime()/86400000);return dailyMindQuiz[((n%dailyMindQuiz.length)+dailyMindQuiz.length)%dailyMindQuiz.length];}
  function renderDailyQuiz(){
    const q=getTodayQuiz(), box=document.getElementById('daily-quiz-options'); if(!box)return;
    document.getElementById('daily-quiz-question').textContent=q.q; box.innerHTML='';
    const done=(appData.dailyQuizDays||[]).includes(localDateKey(new Date()));
    q.a.forEach((answer,i)=>{const b=document.createElement('button');b.type='button';b.className='quiz-option';b.textContent=answer;b.disabled=done;b.onclick=()=>answerDailyQuiz(i);box.appendChild(b);});
    if(done) document.getElementById('daily-quiz-feedback').textContent='आजचा Quiz पूर्ण झाला. उद्या नवीन प्रश्न मिळेल!';
  }
  function answerDailyQuiz(index){
    const today=localDateKey(new Date());appData.dailyQuizDays=Array.isArray(appData.dailyQuizDays)?appData.dailyQuizDays:[];
    if(appData.dailyQuizDays.includes(today))return;
    const q=getTodayQuiz(), buttons=document.querySelectorAll('#daily-quiz-options .quiz-option');
    buttons.forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('correct');else if(i===index)b.classList.add('wrong');});
    appData.dailyQuizDays.push(today);if(index===q.correct)appData.quizCorrect=(Number(appData.quizCorrect)||0)+1;
    recordWellnessAction('daily-quiz',10);
    document.getElementById('daily-quiz-feedback').textContent=(index===q.correct?'Correct! 🌟 ':'Good try! ') + q.why + ' +10 points for taking part.';
    syncUI();
  }
  function spinDailyReward(){
    const today=localDateKey(new Date());appData.spinRewardDays=Array.isArray(appData.spinRewardDays)?appData.spinRewardDays:[];
    if(appData.spinRewardDays.includes(today))return;
    const rewards=[5,10,15,20,25];const reward=rewards[Math.floor(Math.random()*rewards.length)];
    appData.spinRewardDays.push(today);appData.spinRewards=Array.isArray(appData.spinRewards)?appData.spinRewards:[];appData.spinRewards.push({date:today,points:reward});
    appData.wellnessXP=(Number(appData.wellnessXP)||0)+reward;
    const wheel=document.getElementById('reward-wheel');if(wheel)wheel.style.transform='rotate('+(720+Math.floor(Math.random()*360))+'deg)';
    const feedback=document.getElementById('spin-feedback');if(feedback)feedback.textContent='You won '+reward+' wellness points! 🎉';
    const button=document.getElementById('spin-button');if(button){button.disabled=true;button.textContent='Come back tomorrow ✓';}
    renderEngagement();syncUI();
  }
  const achievementList=[
    {id:'first-step',icon:'🌱',name:'First Step',desc:'Complete your first wellness activity',test:d=>(d.wellnessXP||0)>=1},
    {id:'quiz-starter',icon:'🧠',name:'Curious Mind',desc:'Complete 3 daily quizzes',test:d=>(d.dailyQuizDays||[]).length>=3},
    {id:'three-days',icon:'🔥',name:'3-Day Spark',desc:'Build a 3-day streak',test:d=>getWellnessStreak()>=3},
    {id:'week',icon:'🌟',name:'One Week Strong',desc:'Build a 7-day streak',test:d=>getWellnessStreak()>=7},
    {id:'hundred',icon:'💯',name:'Century Club',desc:'Earn 100 wellness points',test:d=>(d.wellnessXP||0)>=100},
    {id:'challenge-five',icon:'🌼',name:'Five-Day Reflection',desc:'Complete five daily challenges',test:d=>(d.dailyChallengeDays||[]).length>=5}
  ];
  function renderAchievementWall(){
    const wall=document.getElementById('achievement-wall');if(!wall)return;wall.innerHTML='';let unlocked=0;
    achievementList.forEach(a=>{const yes=!!a.test(appData);if(yes)unlocked++;const item=document.createElement('div');item.className='achievement'+(yes?'':' locked');item.innerHTML='<div class="medal">'+a.icon+'</div><strong>'+a.name+'</strong><small>'+a.desc+'</small><small>'+(yes?'Unlocked ✓':'Locked')+'</small>';wall.appendChild(item);});
    const count=document.getElementById('achievement-count');if(count)count.textContent=unlocked+' / '+achievementList.length+' unlocked';
  }
  function renderFunZone(){renderDailyQuiz();renderAchievementWall();const done=(appData.spinRewardDays||[]).includes(localDateKey(new Date()));const b=document.getElementById('spin-button');if(b){b.disabled=done;b.textContent=done?'Come back tomorrow ✓':'Spin for points';}if(done){const last=(appData.spinRewards||[]).filter(x=>x.date===localDateKey(new Date())).slice(-1)[0];const f=document.getElementById('spin-feedback');if(f&&last)f.textContent='Today’s reward: '+last.points+' points. See you tomorrow!';}}
  window.answerDailyQuiz=answerDailyQuiz;window.spinDailyReward=spinDailyReward;


  function getTodayCoreCompletion() {
    const today = localDateKey(new Date());
    const mood = (appData.moodEntries || []).some(entry => entry.date === today);
    const challenge = !!(appData.dailyChallenge && appData.dailyChallenge.date === today && appData.dailyChallenge.done);
    const journal = (appData.journals || []).some(entry => entry.dateKey === today || String(entry.date || '').startsWith(today));
    const breathing = !!(appData.breathingDates || []).includes(today) || (!!appData.breathingCompletedToday && appData.breathingCompletedDate === today);
    const tasks = [
      {name:'Mood check-in',detail:mood?'Mood saved':'Choose how you feel',done:mood},
      {name:'Daily mini challenge',detail:challenge?'Challenge completed':'One small reflection',done:challenge},
      {name:'Breathing exercise',detail:breathing?'Breathing completed':'Take one calm minute',done:breathing},
      {name:'Private journal',detail:journal?'Journal entry saved':'Write one short thought',done:journal}
    ];
    return {tasks,count:tasks.filter(t=>t.done).length};
  }
  function updateDailyStreakIfComplete() {
    const today=localDateKey(new Date());
    const status=getTodayCoreCompletion();
    appData.activities=status.count;
    appData.wellnessDays=Array.isArray(appData.wellnessDays)?appData.wellnessDays:[];
    if(status.count===4){
      if(!appData.wellnessDays.includes(today)) appData.wellnessDays.push(today);
    } else {
      // Do not let an earlier single-action record count as a completed all-task streak day.
      appData.wellnessDays=appData.wellnessDays.filter(day=>day!==today);
    }
    return status;
  }
  function renderWeeklyWellnessReport(){
    const box=document.getElementById('weekly-wellness-bars');
    if(!box)return;
    const completedDays=new Set(Array.isArray(appData.wellnessDays)?appData.wellnessDays:[]);
    const today=new Date();
    const labels=[];let count=0;
    for(let offset=6;offset>=0;offset--){
      const d=new Date(today);d.setDate(today.getDate()-offset);
      const key=localDateKey(d),done=completedDays.has(key);if(done)count++;
      labels.push({key,label:d.toLocaleDateString('en-US',{weekday:'short'}),done});
    }
    box.innerHTML='';
    labels.forEach(day=>{
      const item=document.createElement('div');item.className='weekly-day'+(day.done?' is-done':'');
      const track=document.createElement('div');track.className='weekly-day-track';

  // Unlimited Scrollable Calendar Strip Generator
  function generateUnlimitedCalendar() {
    const strip = document.querySelector('.day-strip');
    if (!strip) return;
    strip.innerHTML = '';
    
    // Allow horizontal scrolling for unlimited past/future days
    strip.style.overflowX = 'auto';
    strip.style.scrollBehavior = 'smooth';
    strip.style.paddingBottom = '4px';

    const today = new Date();
    
    // Generate 30 days in the past and 30 days in the future (unlimited browsing)
    for (let i = -30; i <= 30; i++) {
      const d = new Date(today);
      d.setDate(today.getDate() + i);
      
      const dayName = d.toLocaleDateString('en-US', { weekday: 'short' });
      const dateNum = d.getDate();
      const isToday = i === 0;
      
      const pill = document.createElement('div');
      pill.className = `day-pill ${isToday ? 'today' : ''}`;
      pill.style.minWidth = '42px';
      pill.style.flexShrink = '0';
      pill.innerHTML = `<span>${dayName}</span><strong>${dateNum}</strong>${isToday ? '<div class="day-dot"></div>' : ''}`;
      strip.appendChild(pill);
    }
  }

  function completeToolStep(button) {
    recordToolDayStatus('completed');
    const currentCard = button.closest('.card');
    const currentPanel = button.closest('.tool-panel');
    if (currentCard && currentPanel) {
      const cards = Array.from(currentPanel.querySelectorAll(':scope > .card, :scope > div.card'));
      const nextCard = cards[cards.indexOf(currentCard) + 1];
      if (nextCard) { nextCard.scrollIntoView({behavior:'smooth', block:'start'}); return; }
      const panels = getToolPanels();
      const nextPanel = panels[panels.indexOf(currentPanel) + 1];
      if (nextPanel) { activateToolPanel(nextPanel); return; }
    }
    alert('Step completed! Your calendar has been updated.');
  }

  function skipToNextToolStep(button) {
    recordToolDayStatus('skipped');
    const currentCard = button.closest('.card');
    const currentPanel = button.closest('.tool-panel');
    if (!currentPanel) return;
    const cards = Array.from(currentPanel.querySelectorAll(':scope > .card, :scope > div.card'));
    const cardIndex = cards.indexOf(currentCard);
    const nextCard = cardIndex >= 0 ? cards[cardIndex + 1] : null;
    if (nextCard) {
      nextCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    const panels = getToolPanels();
    const nextPanel = panels[panels.indexOf(currentPanel) + 1];
    if (nextPanel) activateToolPanel(nextPanel);
    else {
      const firstPanel = panels[0];
      activateToolPanel(firstPanel);
      const status = document.createElement('div');
      status.className = 'alert-box';
      status.style.display = 'block';
      status.textContent = 'You have reached the end of the Wellness Tools. You can revisit any exercise whenever you need.';
      firstPanel.prepend(status);
      setTimeout(() => status.remove(), 5000);
    }
  }

  function playTone(hz) {
    stopTone();
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(hz, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    const st = document.getElementById('sound-status');
    st.style.display = "block";
    st.innerText = `Playing ${hz}Hz relaxation sound...`;
  }

  function stopTone() {
    if (osc) { osc.stop(); osc.disconnect(); osc = null; }
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    document.getElementById('sound-status').style.display = "none";
  }

  function companionReply(message) {
    const m = message.toLowerCase();
    if (/exam|study|result|marks|college|assignment/.test(m))
      return "Exam pressure can feel heavy. Try one topic for 20 minutes, then take a 5-minute break. What is one manageable topic you can start with?";
    if (/lonely|alone|homesick|miss/.test(m))
      return "Feeling lonely can be difficult. Could you message someone you trust or spend a little time with a supportive friend today?";
    if (/anxious|anxiety|panic|worry|nervous/.test(m))
      return "Let's slow things down. Breathe in gently for 4 counts and out for 6 counts. Repeat five times, then name one thing you can see, hear and feel.";
    if (/angry|anger|irritat|furious/.test(m))
      return "It's okay to notice anger without acting on it. Pause before replying, relax your shoulders, and step away for a moment if you can.";
    if (/sad|unhappy|cry|low|down/.test(m))
      return "I'm sorry today feels hard. You don't have to solve everything at once. Try one kind action for yourself, or talk to someone you trust.";
    if (/stress|overwhelm|pressure/.test(m))
      return "When everything feels overwhelming, pause and separate what needs attention now from what can wait. Take three slow breaths, then choose one small next step.";
    return "Thank you for sharing. What feels most important right now? You can tell me a little more, or we can try a short breathing exercise.";
  }

    if(!text){document.getElementById('today-journal-feedback').textContent='कृपया एक छोटा विचार लिही.';return;}
    const today=localDateKey(new Date());
    if((appData.journals||[]).some(j=>j.dateKey===today)){
      document.getElementById('today-journal-feedback').textContent='आजची Journal Entry आधीच सेव्ह झाली आहे.';return;
    }
    appData.journals=Array.isArray(appData.journals)?appData.journals:[];
    const time=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    appData.journals.unshift({dateKey:today,date:`Today, ${time}`,text});
    recordWellnessAction('journal',10);
    renderDailyTaskStatus();
    try{await syncUI();input.value='';document.getElementById('today-journal-feedback').textContent='Private note saved to your account ✓';}
    catch(e){document.getElementById('today-journal-feedback').textContent='Save failed. Check your connection and try again.';}
  }

  function addJournal() {

  function closeSOS() { stopSOSBreathing(); document.getElementById('sos-modal').classList.remove('open'); }

  let sosBreathingTimer = null, sosBreathingStep = 0;
  function startSOSBreathing() {
    stopSOSBreathing();
    const status = document.getElementById('sos-breath-status');
    const lang = document.documentElement.lang || 'en';
    const labels = {en:['Breathe in gently','Breathe out slowly','Exercise complete'],mr:['हळू श्वास आत घ्या','हळू श्वास बाहेर सोडा','सराव पूर्ण झाला'],hi:['धीरे से साँस अंदर लें','धीरे से साँस बाहर छोड़ें','अभ्यास पूरा हुआ']};
    const words = labels[lang] || labels.en;
    sosBreathingStep = 0;
    const tick = () => {
      if (sosBreathingStep >= 12) { stopSOSBreathing(); status.textContent = words[2]; return; }
      status.textContent = words[sosBreathingStep % 2] + ' · ' + (Math.floor(sosBreathingStep / 2) + 1) + '/6';
      sosBreathingStep++;
    };
    tick(); sosBreathingTimer = setInterval(tick, 5000);
  }
  function stopSOSBreathing() {
    if (sosBreathingTimer) clearInterval(sosBreathingTimer);
    sosBreathingTimer = null;
    const status = document.getElementById('sos-breath-status');
    if (status && sosBreathingStep < 12) {
      const lang = document.documentElement.lang || 'en';
      status.textContent = ({en:'Breathing exercise stopped',mr:'श्वसन सराव थांबवला',hi:'श्वास अभ्यास रोक दिया गया'})[lang] || 'Breathing exercise stopped';
    }
    sosBreathingStep = 12;
  }

    const guides = {
      panic: {

      racing:{mr:['परीक्षेचा ताण कमी करण्यासाठी','१. संपूर्ण अभ्यासक्रमाचा विचार थोडा थांबवा.','२. पुढील १५ मिनिटांसाठी एकच विषय किंवा एकच प्रश्न निवडा.','३. पुस्तक, पाणी आणि आवश्यक साहित्य जवळ ठेवा.','४. १५ मिनिटे अभ्यास करा आणि नंतर छोटा ब्रेक घ्या.','५. झोप आणि विश्रांतीही तयारीचाच भाग आहेत.'],hi:['परीक्षा के तनाव को संभालने के लिए','१. अभी पूरे पाठ्यक्रम के बारे में सोचना रोकें।','२. अगले १५ मिनट के लिए एक विषय या एक प्रश्न चुनें।','३. किताब, पानी और ज़रूरी सामग्री पास रखें।','४. १५ मिनट पढ़ें और फिर छोटा विराम लें।','५. नींद और आराम भी तैयारी का हिस्सा हैं।'],en:['When exam thoughts are racing','1. Pause thinking about the entire syllabus.','2. Choose one topic or one question for the next 15 minutes.','3. Keep your book, water, and essentials nearby.','4. Study for 15 minutes, then take a short break.','5. Sleep and rest are also part of preparation.']},

      stress:{mr:['मानसिक तणाव जाणवत असल्यास','१. आत्ता थांबा आणि तीन आरामशीर श्वास घ्या.','२. मनातल्या गोष्टी कागदावर लिहा.','३. तातडीचे आणि थांबू शकणारे काम वेगळे करा.','४. एका छोट्या कामापासून सुरुवात करा.','५. तणाव रोजच्या आयुष्यावर परिणाम करत असल्यास तज्ज्ञांची मदत घ्या.'],hi:['मानसिक तनाव महसूस हो तो','१. रुकें और तीन सहज साँस लें।','२. मन में चल रही बातें कागज़ पर लिखें।','३. ज़रूरी और बाद में किए जा सकने वाले काम अलग करें।','४. एक छोटे काम से शुरुआत करें।','५. तनाव रोज़मर्रा के जीवन को प्रभावित करे तो विशेषज्ञ से मदद लें।'],en:['If you are feeling stressed','1. Pause and take three comfortable breaths.','2. Write down what is on your mind.','3. Separate urgent tasks from those that can wait.','4. Start with one small task.','5. Seek professional support if stress is affecting daily life.']},
      safety:{mr:['तुमच्या सुरक्षिततेला प्राधान्य द्या','१. तातडीचा धोका असल्यास सुरक्षित ठिकाणी जा.','२. भारतातील आपत्कालीन मदतीसाठी 112 वर कॉल करा.','३. जवळच्या विश्वासू व्यक्तीला लगेच सांगा आणि एकटे राहू नका.','४. स्वतःला इजा करण्याचा विचार येत असल्यास धोकादायक वस्तूंपासून दूर जा आणि तातडीने प्रत्यक्ष मदत घ्या.'],hi:['अपनी सुरक्षा को प्राथमिकता दें','१. तुरंत खतरा हो तो सुरक्षित जगह पर जाएँ।','२. भारत में आपातकालीन सहायता के लिए 112 पर कॉल करें।','३. किसी भरोसेमंद व्यक्ति को तुरंत बताएँ और अकेले न रहें।','४. खुद को नुकसान पहुँचाने का विचार आए तो खतरनाक चीज़ों से दूर जाएँ और तुरंत आमने-सामने मदद लें।'],en:['Put your immediate safety first','1. If you are in immediate danger, move to a safer place.','2. Call 112 for emergency assistance in India.','3. Tell a trusted person now and avoid staying alone.','4. If you may hurt yourself, move away from anything dangerous and get in-person help immediately.']}
    };
    const data = guides[type];
    if (!data) return;
    const lines = data[lang] || data.en;

  function escapeSOSHTML(value) { return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
  function loadSOSContact() {
    try {
      const saved = JSON.parse(localStorage.getItem('mindoraSOSContact') || 'null');
      document.getElementById('sos-contact-name').value = saved?.name || '';
      document.getElementById('sos-contact-phone').value = saved?.phone || '';
    } catch(e) { /* Storage may be unavailable; user can still use emergency links. */ }
  }
  function saveSOSContact() {
    const name = document.getElementById('sos-contact-name').value.trim();
    const phone = document.getElementById('sos-contact-phone').value.trim();
    const digits = phone.replace(/[^0-9+]/g,'');
    if (!name || digits.replace(/\D/g,'').length < 10) { alert(document.documentElement.lang === 'mr' ? 'कृपया नाव आणि वैध मोबाईल नंबर भरा.' : document.documentElement.lang === 'hi' ? 'कृपया नाम और सही मोबाइल नंबर भरें।' : 'Please enter a name and a valid phone number.'); return; }
    try { localStorage.setItem('mindoraSOSContact', JSON.stringify({name,phone:digits})); alert(document.documentElement.lang === 'mr' ? 'विश्वासू व्यक्तीची माहिती या डिव्हाइसवर सेव्ह झाली.' : document.documentElement.lang === 'hi' ? 'भरोसेमंद व्यक्ति की जानकारी इस डिवाइस पर सेव हो गई।' : 'Trusted contact saved on this device.'); }
    catch(e) { alert('Could not save on this device. You can still use the emergency numbers below.'); }
  }
  function callSOSContact() {
    const phone = document.getElementById('sos-contact-phone').value.trim().replace(/[^0-9+]/g,'');
    if (!phone || phone.replace(/\D/g,'').length < 10) { alert(document.documentElement.lang === 'mr' ? 'आधी वैध मोबाईल नंबर सेव्ह करा.' : 'Please enter a valid contact number first.'); return; }
    window.location.href = 'tel:' + phone;
  }
  function deleteSOSContact() {
    try { localStorage.removeItem('mindoraSOSContact'); } catch(e) {}
    document.getElementById('sos-contact-name').value = '';
    document.getElementById('sos-contact-phone').value = '';
  }
  function getSOSContact() {
    const name = document.getElementById('sos-contact-name').value.trim();
    const raw = document.getElementById('sos-contact-phone').value.trim();
    let phone = raw.replace(/\D/g, '');
    if (phone.length === 10) phone = '91' + phone;
    else if (phone.length === 11 && phone.startsWith('0')) phone = '91' + phone.slice(1);
    if (!name || phone.length < 10 || phone.length > 15) {
      alert(document.documentElement.lang === 'mr' ? 'आधी विश्वासू व्यक्तीचे नाव आणि योग्य मोबाईल नंबर सेव्ह करा.' : document.documentElement.lang === 'hi' ? 'पहले भरोसेमंद व्यक्ति का नाम और सही मोबाइल नंबर सेव करें।' : 'Please save a trusted person’s name and valid phone number first.');
      return null;
    }
    return {name, phone};
  }
  function openSOSWhatsApp(message) {
    const contact = getSOSContact();

    const url = 'https://wa.me/' + contact.phone + '?text=' + encodeURIComponent(message);
    window.open(url, '_blank', 'noopener,noreferrer');
  }

    };

  function shareSOSLocation() {
    const status = document.getElementById('sos-share-status');
    const lang = document.documentElement.lang || 'en';
    if (!navigator.geolocation) { status.textContent = lang === 'mr' ? 'या ब्राउझरमध्ये लोकेशन सुविधा उपलब्ध नाही.' : 'Location is not available in this browser.'; return; }
    status.textContent = lang === 'mr' ? 'लोकेशनची परवानगी मागितली जात आहे…' : lang === 'hi' ? 'लोकेशन की अनुमति माँगी जा रही है…' : 'Requesting location permission…';
    navigator.geolocation.getCurrentPosition(position => {
      const lat = position.coords.latitude.toFixed(6), lon = position.coords.longitude.toFixed(6);
      const map = 'https://maps.google.com/?q=' + lat + ',' + lon;
      const messages = {
        en: 'I may need help. This is my current location: ' + map + ' Please call me.',
        mr: 'मला मदतीची गरज असू शकते. माझे सध्याचे लोकेशन: ' + map + ' कृपया मला फोन करा.',
        hi: 'मुझे मदद की ज़रूरत हो सकती है। मेरी वर्तमान लोकेशन: ' + map + ' कृपया मुझे कॉल करें।'

    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const name = document.getElementById('auth-name').value.trim();
    const college = document.getElementById('auth-college').value.trim();

    const submit = document.getElementById('auth-submit');
    if (!email || !password) return showAuthMessage('Enter your email and password.', true);
    if (authView === 'signup' && authMode === 'student' && !name) return showAuthMessage('Enter your full name.', true);
    if (authView === 'signup' && authMode === 'student' && !college) return showAuthMessage('Enter your college name.', true);
    if (authView === 'signup' && authMode === 'student' && !course) return showAuthMessage('Enter your course or program.', true);
    submit.disabled = true;
    submit.textContent = 'Please wait...';
    try {
      if (authView === 'signup' && authMode === 'student') {
        const credential = await auth.createUserWithEmailAndPassword(email, password);
        await db.collection('users').doc(credential.user.uid).set({
          name, college, course, email, role: 'student',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } else {
        const credential = await auth.signInWithEmailAndPassword(email, password);
        const userRef = db.collection('users').doc(credential.user.uid);
        const profileSnap = await userRef.get();
        let profile = profileSnap.exists ? profileSnap.data() : null;

        // Accounts added directly in Firebase Console do not automatically get a
        // Firestore student profile. Create the student's own profile on first login.
        if (!profile && authMode === 'student') {
          const safeName = name || (credential.user.email || email).split('@')[0];
          await userRef.set({
            name: safeName,
            email: credential.user.email || email,
            role: 'student',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          profile = { name: safeName, email: credential.user.email || email, role: 'student' };
        }

        const role = profile ? profile.role : null;
        if (authMode === 'admin' && role !== 'admin') {
          await auth.signOut();
          throw new Error('This account is not assigned the admin role. Ask the project owner to authorize it.');
        }
        if (authMode === 'student' && role !== 'student') {
          await auth.signOut();
          throw new Error('This account is not set up as a student. Please contact the project admin.');
        }
      }

    const month = calendarViewDate.getMonth();

    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(day => {
      const el = document.createElement('div'); el.className = 'calendar-weekday'; el.textContent = day; grid.appendChild(el);
    });
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const prevDays = new Date(year, month, 0).getDate();
    const todayKey = localDateKey(new Date());
    for (let i=0; i<42; i++) {
      let dayNum, date, muted=false;
      if (i < firstDay) { dayNum = prevDays - firstDay + i + 1; date = new Date(year, month-1, dayNum); muted=true; }
      else if (i >= firstDay + daysInMonth) { dayNum = i - firstDay - daysInMonth + 1; date = new Date(year, month+1, dayNum); muted=true; }
      else { dayNum = i - firstDay + 1; date = new Date(year, month, dayNum); }
      date.setHours(0,0,0,0);
      const key = localDateKey(date);
      const btn = document.createElement('button');
      btn.type='button';

      alert('Study time must be 1–180 minutes and break time 1–60 minutes.');return;
    }
    focusStudyMinutes=study;focusBreakMinutes=rest;
    resetFocusTimer();
    document.getElementById('focus-timer-status').textContent='Your custom times are applied.';
  }
  function startFocusTimer(){
    if(focusInterval)return;
    document.getElementById('focus-timer-status').textContent=focusMode==='focus'?'Study session running…':'Break session running…';
    focusInterval=setInterval(()=>{
      focusSeconds--;updateFocusDisplay();
      if(focusSeconds<=0){
        clearInterval(focusInterval);focusInterval=null;
        if(focusMode==='focus'){
          focusMode='break';focusSeconds=focusBreakMinutes*60;updateFocusDisplay();
          document.getElementById('focus-timer-status').textContent='Study session complete. Your break has started automatically.';
          startFocusTimer();
        }else{
          focusMode='focus';focusSeconds=focusStudyMinutes*60;updateFocusDisplay();
          document.getElementById('focus-timer-status').textContent='Break complete. Your next study session has started automatically.';
          startFocusTimer();

      }
    },1000);

    const e=document.getElementById('focus-timer-status');if(e)e.textContent='Timer paused.';
  }
  function resetFocusTimer(){
    pauseFocusTimer();focusSeconds=(focusMode==='focus'?focusStudyMinutes:focusBreakMinutes)*60;updateFocusDisplay();
  }
  function skipFocusTask(){
    pauseFocusTimer();
    if(focusMode==='focus'){
      focusMode='break';focusSeconds=focusBreakMinutes*60;

    }else{

  }

const reverse={mr:{},hi:{}}; for(const [en,v] of Object.entries(words)){reverse.mr[v[0]]=en;reverse.hi[v[1]]=en;}
let current='en';
function translateTextNode(node,lang){const raw=node.nodeValue;const trim=raw.trim();if(!trim)return;let en=raw.trim();if(lang!=='en'){if(reverse.mr[en])en=reverse.mr[en];if(reverse.hi[en])en=reverse.hi[en];const val=words[en]?.[lang==='mr'?0:1];if(val)node.nodeValue=raw.replace(trim,val);}else{if(reverse.mr[en])en=reverse.mr[en];if(reverse.hi[en])en=reverse.hi[en];if(words[en])node.nodeValue=raw.replace(trim,en);}}
function translatePage(lang){current=lang;document.documentElement.lang=lang;const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode()){if(n.parentElement?.closest('script,style'))continue;translateTextNode(n,lang);}const attrs=['placeholder','title','aria-label'];document.querySelectorAll('input,textarea,button,select,label').forEach(el=>attrs.forEach(a=>{const v=el.getAttribute(a);if(!v)return;let en=v.trim();if(lang==='en'){en=reverse.mr[en]||reverse.hi[en]||en;el.setAttribute(a,en);}else{en=reverse[lang][en]||en;const t=words[en]?.[lang==='mr'?0:1];if(t)el.setAttribute(a,t);}}));}
window.setMinddoraLanguage=function(lang){translatePage(lang);try{localStorage.setItem('mindoraLanguage',lang);}catch(e){}};
document.addEventListener('DOMContentLoaded',()=>{const sel=document.getElementById('mindora-language');let saved='en';try{saved=localStorage.getItem('mindoraLanguage')||'en';}catch(e){}if(sel)sel.value=saved;translatePage(saved);const obs=new MutationObserver(records=>{for(const r of records){r.addedNodes.forEach(node=>{if(node.nodeType===Node.TEXT_NODE)translateTextNode(node,current);else if(node.nodeType===Node.ELEMENT_NODE){const w=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);let t;while(t=w.nextNode())translateTextNode(t,current);}});}});obs.observe(document.body,{childList:true,subtree:true});});
})();
